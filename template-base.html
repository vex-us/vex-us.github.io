<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXUS VENTURES - [PAGE_TITLE]</title>
    <link rel="stylesheet" href="vexus-style.css">
</head>
<body>
    <div class="cyberpunk-container">
        <!-- Vexus Header with Interactive Effect -->
        <div class="vexus-header">
            <div class="text-reveal-zone"></div>
            <div class="brand-text">VEXUS</div>
            <div class="orbiter sprite-1"></div>
            <div class="orbiter sprite-2"></div>
            <div class="orbiter sprite-3"></div>
        </div>

        <!-- Navigation -->
        <nav class="cyber-nav">
            <a href="index.html" class="nav-link">HOME</a>
            <a href="services.html" class="nav-link">SERVICES</a>
            <a href="portfolio.html" class="nav-link">PORTFOLIO</a>
            <a href="contact.html" class="nav-link">CONTACT</a>
        </nav>

        <!-- Main Content -->
        <main class="cyber-main">
            <!-- Hero Section (Optional) -->
            <section class="hero-section">
                <h1 class="cyber-title">[PAGE_HEADING]</h1>
                <p class="tagline">[PAGE_TAGLINE]</p>
            </section>

            <!-- Content Sections -->
            <section class="content-section">
                <h2 class="section-title">[SECTION_TITLE]</h2>
                
                <!-- Vision Cards Grid (Optional) -->
                <div class="content-grid">
                    <div class="vision-card">
                        <h3>[CARD_TITLE]</h3>
                        <p>[CARD_CONTENT] with <span class="highlight-magenta">highlighted text</span> and <span class="highlight-cyan">cyan highlights</span>.</p>
                    </div>
                    <!-- Repeat for additional cards -->
                </div>

                <!-- Text Content (Alternative) -->
                <div class="approach-content">
                    <p>[PARAGRAPH_CONTENT] with <span class="highlight-magenta">magenta highlights</span> for emphasis.</p>
                </div>
            </section>

            <!-- Additional sections as needed -->
        </main>

        <footer class="cyber-footer">
            <p>&copy; 2024 VEXUS VENTURES</p>
        </footer>
    </div>

    <script src="vexus-effects.js"></script>
</body>
</html>
